<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
	<title>Calculator</title>
</head>
<body>
	<div class="container">
        <div class="section">
            <input type="text" placeholder="0" id="inputbox">
            <div class="buttons">
                <ul class="lines">
                    <li class="operator button">AC</li>
                    <li class="operator" onclick="removeLastDigit()">DEL</li>
                    <li class="operator button">%</li>
                    <li class="operator button">/</li>
                </ul>
                <ul class="lines">
                    <li class="button">7</li>
                    <li class="button">8</li>
                    <li class="button">9</li>
                    <li class="operator button">*</li>
                </ul>
                <ul class="lines">
                    <li class="button">4</li>
                    <li class="button">5</li>
                    <li class="button">6</li>
                    <li class="operator button">-</li>
                </ul>
                <ul class="lines">
                    <li class="button">1</button>
                    <li class="button">2</li>
                    <li class="button">3</li>
                    <li  class="operator button">+</li>
                </ul>
                <ul class="lines">
                    <!-- <li class="button" onclick="numberButtons('00')">00</li> -->
                    <li class="button">00</li>
                    <li class="button">0</li>
                    <li class="button" onchange="addDecimal()">.</li>
                    <li class="equal-btn button">=</li>
                </ul>
            </div>
        </div>
    </div>


    <script src="script.js"></script>

</body>
</html>
